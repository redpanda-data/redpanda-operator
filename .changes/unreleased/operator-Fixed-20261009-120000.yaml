project: operator
kind: Fixed
body: |-
    StretchCluster `ClusterRole` and `ClusterRoleBinding` names are no longer
    truncated to 63 characters. When `<pool fullname>-<namespace>` reached that
    limit, a pool's `ClusterRole`s rendered under the same name, overwriting each
    other's rules.
