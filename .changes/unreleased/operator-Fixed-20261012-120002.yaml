project: operator
kind: Fixed
body: |-
    Console credentials given `inline` or as `externalSecretRef` in `staticConfiguration` reach Console

      The operator resolves these values and stores them in a Secret named `<console>-cluster-credentials`
      that it owns, so Console reads them from that Secret and they stay out of the Deployment spec.
      `externalSecretRef` requires `--enable-cloud-secrets`.
