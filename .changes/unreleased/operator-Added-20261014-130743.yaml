project: operator
kind: Added
body: 'Broker pods start with a data-dir guard init container. Once a Broker''s node_id is known, the operator stamps it on the pod (cluster.redpanda.com/broker-id) and the guard refuses to boot Redpanda when that stamp is present but the data directory holds no kvstore, so a wiped or replaced disk never re-registers the broker under a new node_id. The Broker is marked DiskLost at once and dismantled like a broker whose node vanished, and a fresh Broker takes its slot. The guard runs the operator image taken from the sidecar container (V2) or the configurator settings (V1): a pinned image older than this release has no data-guard command and Broker pods will not start until the pin moves. Adding the init container rolls every broker-mode cluster once on upgrade.'
