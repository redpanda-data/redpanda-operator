project: operator
kind: Added
body: 'Broker pods start with a data-guard init container. Once a Broker''s node_id is known, the operator stamps it on the pod (operator.redpanda.com/node-id, the annotation the V1 cluster controller already writes on StatefulSet pods) and the guard refuses to boot Redpanda when that stamp is present but the data volume is empty, so a wiped or replaced disk never re-registers the broker under a new node_id. The Broker is marked DiskLost at once and dismantled like a broker whose node vanished, and a fresh Broker takes its slot. The guard refuses only a volume it can prove empty: a data directory it cannot read, that is not mounted, or that holds data without a kvstore keeps the pod from starting without deleting anything, and the Broker reports Stuck until an operator intervenes; a redpanda.data_directory set to a subdirectory of the data volume is one such case, so keep the default data directory in broker mode. The guard runs the operator''s own image (the configurator image settings) with the redpanda container''s data mount and user, so a pinned sidecar image cannot leave it without the data-guard command. Adding the init container rolls every broker-mode cluster once on upgrade.'
