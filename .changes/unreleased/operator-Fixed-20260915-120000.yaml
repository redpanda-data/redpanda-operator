project: operator
kind: Fixed
body: |-
    The PVCUnbinder now reserves a freed PersistentVolume for the claim it served
    instead of leaving it unreachable or floating. Previously a freed PV's
    `spec.claimRef` was either left fully populated (the default: the volume
    dead-ends as Released, so the disk keeps its data but no claim can ever bind
    it again and the recreated claim always provisions a fresh, empty disk) or
    cleared to nil under the deprecated `--allow-pv-rebinding` (the volume becomes
    bindable by ANY claim, which can hand one broker another broker's disk — the
    cross-broker swap). The unbinder now clears just the UID from `spec.claimRef`
    while the volume's pinned node still exists, reserving the volume for the
    StatefulSet-recreated claim of the same name: the broker waits for its node
    and gets its own data back, and no other claim can ever bind the disk. While
    waiting, reconciles defer with a `reserved-pv` gate Event and metric label
    instead of re-unbinding the same claim in a loop. Once the Node object is
    deleted, the next unbind leaves the volume as a Released dead end so the
    recreated claim provisions a fresh disk elsewhere, and the orphaned volume
    retains the data for manual recovery. `--allow-pv-rebinding` no longer clears
    ClaimRefs; its only remaining effect is to force the pvc-rebinding gate's most
    conservative behavior (no stuck-claim exemption).
