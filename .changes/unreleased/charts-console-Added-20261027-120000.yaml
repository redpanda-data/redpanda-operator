project: charts/console
kind: Added
body: |-
    Added `pipelines` to let Console manage Redpanda Connect pipelines that run as Pipeline resources. Set `pipelines.enabled: true`, and optionally `pipelines.namespace` (defaults to the release namespace) and `pipelines.clusterRef`. The chart sets `config.pipelines.kubernetes` from these values and mounts the ServiceAccount token into the Console Pods.

      By default, Console uses its ServiceAccount: the chart creates a Role and RoleBinding named `<fullname>-pipelines`, plus a ValidatingAdmissionPolicy (Kubernetes 1.30+, opt out with `pipelines.admissionPolicy.enabled: false`) that stops Console from adding or changing Pipeline fields other than the ones it writes. With `pipelines.impersonateUser: true`, Console calls Kubernetes as the logged-in user instead, and the chart creates the ClusterRoles `<fullname>-<namespace>-pipeline-editor` and `-pipeline-viewer` for you to bind to your identity provider's groups.
