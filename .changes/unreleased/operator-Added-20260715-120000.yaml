project: operator
kind: Added
body: "Added the `Pipeline` CRD and Connect controller (enterprise, opt-in via `--enable-connect` / the chart's `connectController.enabled`): declarative Redpanda Connect pipelines with inline `configYaml`, `cluster.clusterRef`/`cluster.staticConfiguration` connection resolution, `userRef` SCRAM identities, `extraInitContainers`, `affinity`, PodMonitor support, and a config-checksum that rolls pipeline pods on config changes. The resolved cluster connection is rendered both into `input.redpanda`/`output.redpanda` blocks and as the top-level `redpanda:` shared client (redpanda_common support). Reconcile failures surface on status without tearing down running pipelines. Default Connect image: 4.100.0."
time: 2026-07-15T12:00:00.000000-07:00
