project: operator
kind: Added
body: "Added the `Pipeline` CRD and Connect controller (enterprise, opt-in via `--enable-connect` / the chart's `connectController.enabled`): declarative Redpanda Connect pipelines with inline `configYaml`, `cluster.clusterRef`/`cluster.staticConfiguration` connection resolution (including ConfigMap truststores and mTLS client certificates), `userRef` SCRAM identities, `valueSources`, `extraInitContainers` + `extraVolumes`/`extraVolumeMounts`, `affinity`, PodMonitor support, and pod-template checksums that roll pipeline pods on config changes and on referenced Secret/ConfigMap rotations. The resolved cluster connection is rendered both into `input.redpanda`/`output.redpanda` blocks and as the top-level `redpanda:` shared client (redpanda_common support). Referenced Users, password Secrets, and valueSources are validated at reconcile time and surface on dedicated status conditions (`ClusterRef`, `UserRef`, `ValueSourcesResolved`, `License`); reconcile failures surface on status without tearing down running pipelines, and the controller refuses to adopt same-named objects it does not own (`NameConflict`). Default Connect image: 4.100.0."
time: 2026-07-15T12:00:00.000000-07:00
