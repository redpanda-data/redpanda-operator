project: operator
kind: Fixed
body: |-
    Setting `post_install_job.enabled=false` on a Redpanda resource no longer silently wedges cluster configuration.

      Cluster configuration was derived from the chart's rendered post-install job, which renders as nothing when disabled — a nil dereference on every reconcile that left `ConfigurationApplied` in `Error` while `Ready`/`Healthy` kept reporting `True`, so properties set through `spec.clusterSpec.config.cluster` were never applied.
      The bootstrap environment is now derived directly from the chart values, independent of any rendered resource.
      Environment injected through `post_install_job.podTemplate` overlays no longer feeds cluster configuration; cluster-config values have dedicated hooks (`storage.tiered.credentialsSecretRef`, `config.extraClusterConfiguration`).
time: 2026-08-26T21:00:00-07:00
