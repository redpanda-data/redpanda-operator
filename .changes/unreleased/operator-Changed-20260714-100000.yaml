project: operator
kind: Changed
body: |
  **Upgrade behavior change for existing ShadowLinks.** Role and schema
  replication now default to on (see the corresponding "Added" entry). Because
  these defaults are applied by the conversion layer whenever the
  `spec.roleSyncOptions` / `spec.schemaRegistrySyncOptions` sections are absent
  or leave `enabled` unset, **any ShadowLink created before this release will
  begin replicating all RBAC roles (via an include-all filter) and shadowing
  the source cluster's schemas topic on the first reconcile after upgrade** —
  no spec change is required to trigger this. Roles may include privileged or
  superuser roles, so operators should treat this as an expansion of what is
  replicated to the shadow (DR) cluster. To preserve the previous behavior,
  explicitly set `spec.roleSyncOptions.enabled: false` and/or
  `spec.schemaRegistrySyncOptions.enabled: false` on existing ShadowLinks
  **before** upgrading the operator.
