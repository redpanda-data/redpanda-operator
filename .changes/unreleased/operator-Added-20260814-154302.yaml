project: operator
kind: Added
body: 'Experimental Broker CR support in the V2 Redpanda reconciler: annotating a Redpanda with operator.redpanda.com/use-broker-cr migrates its pods from StatefulSets to per-broker Broker CRs in place, with no pod recreation or restarts, and removing the annotation rolls back the same way (the handover itself is restart-free; configuration changes made while in broker mode then roll through the normal health-gated update flow, one broker at a time); clusters created with the annotation provision Broker CRs directly; NodePool-owned pools get Brokers referencing the NodePool and NodePool status is derived from Broker CRs; broker pods carry StatefulSet identity labels (statefulset.kubernetes.io/pod-name, apps.kubernetes.io/pod-index); post-migration pod adoption is event-driven instead of waiting for a periodic requeue. Prerequisites: the operator must run with --enable-broker AND the experimental Broker CRD must be installed (operator chart value crds.experimental: true, or redpanda-operator crd --experimental). Migration and rollback progress is observable via the BrokerMigration condition on the Redpanda status (InProgress, Blocked, Complete, RolledBack)'
