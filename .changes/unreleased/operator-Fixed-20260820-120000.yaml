project: operator
kind: Fixed
body: |-
    The sidecar's user watcher now sets the `superusers` cluster property once per sync pass, with the union of every users file, instead of once per file with only that file's users.
      Operator-managed clusters never saw the transient superuser revocation this fixes — the operator deploys the sidecar with `--no-set-superusers`, so the watcher never wrote the property there. The visible change for them is log hygiene: malformed users-file lines, which can contain passwords, are no longer echoed into the sidecar log.
      See the redpanda chart's changelog entry for the full description.
