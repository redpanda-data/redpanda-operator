project: operator
kind: Fixed
body: |-
    The sidecar's user watcher now updates the `superusers` cluster property once per sync pass, with the union of every users file, instead of once per file with only that file's users.

      Operator-managed clusters were never exposed to the underlying bug's
      symptom: the operator deploys the sidecar with `--no-set-superusers`, so
      the watcher never wrote the `superusers` property there (the property is
      managed by the main reconciler instead). Only helm-chart deployments could
      see the transient superuser revocation — see the redpanda chart's
      changelog entry for the full description. What this fix changes
      for operator-managed clusters is log hygiene: malformed users-file lines,
      which can contain passwords, are no longer echoed into the sidecar log —
      only the file name and line number are.
