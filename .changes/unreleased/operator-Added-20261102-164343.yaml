project: operator
kind: Added
body: 'A new Prometheus gauge, `operator_broker_phase{namespace, kind, name, phase}`, counts the Broker CRs of each cluster in each `status.phase` (`Pending`, `Provisioning`, `Running`, `Decommissioning`, `Decommissioned`, `Stuck`, `DiskLost`, plus `Unknown` for a Broker not yet reconciled or in a phase this operator version does not know), zero-filled across phases so `> 0` alerts resolve by value; `kind` is `Cluster` for V1 (`redpanda.vectorized.io`) clusters and `Redpanda` for V2, so the two metric controllers never share a series during a migration. Both metric controllers emit it, recomputing at least once a minute; a cluster without Broker CRs (StatefulSet mode) has no series, and a missing Broker CRD is tolerated. Scraped through the chart''s ServiceMonitor the gauge''s own `namespace` label arrives as `exported_namespace`.'
