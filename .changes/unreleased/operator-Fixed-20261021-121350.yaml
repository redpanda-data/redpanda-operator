project: operator
kind: Fixed
body: 'A V1 `Cluster` in broker mode (`operator.redpanda.com/use-broker-cr`) did not restart its brokers after the first cluster configuration change that required a restart: `ClusterConfigured` stayed `False` reporting `Node N needs restart`, `status.restarting` flipped on and off, and the brokers only restarted once a later restart-requiring change arrived. Broker pods were created without the `operator.redpanda.com/cluster-config-version` annotation, so the first restart marker was copied onto the running pods instead of rolling them. Broker pod templates now always carry a baseline marker and the first restart-requiring change rolls the brokers one at a time; a rollback to StatefulSet mode also removes the marker from the released pods so a later migration back to Broker CRs does not roll them for no reason. Clusters already stuck in this state recover on their next restart-requiring configuration change, and a freshly created cluster whose first configuration change requires a restart now rolls once, as it does in StatefulSet mode.'
