project: operator
kind: Fixed
body: |-
    The `resources.memory.enable_memory_locking` field description no longer says to set it to `true` for production

      It now describes what memory locking does, that a `Redpanda` resource applies it only when
      `resources.requests` and `resources.limits` are both unset (otherwise use
      `statefulset.additionalRedpandaCmdFlags`), and that it defaults to `false`.
