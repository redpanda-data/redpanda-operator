project: operator
kind: Added
body: 'The `StretchCluster` reconciler can now automatically recover a broker stuck in the "bad_rejoin" crashloop after a region outage (K8S-843): a decommissioned broker whose PVC survived boots from the stale disk, claims a retired identity, is rejected by the cluster, and never becomes Ready. When a broker pod stays not-Ready past a threshold AND its on-disk identity provably collides with the cluster''s authoritative broker-uuid view, the operator deletes the pod''s PVC and pod so it reschedules onto a fresh disk. This is destructive by design and heavily guarded: it fires only on a confirmed identity collision, sustained unreadiness, a healthy cluster, and zero nodes reported down, wiping at most one disk per reconcile pass. Tune the not-Ready threshold with `--pvc-unbind-not-ready-threshold` (default 5m); set a negative value to disable the behavior entirely.'
time: 2026-07-08T11:00:00+02:00
