project: operator
kind: Fixed
body: |-
    The PVCUnbinder's pvc-rebinding gate (Gate 3) no longer defers on
    unbound claims owned by Pods that are provably deadlocked on the
    unbinder's own remediation. Treating those claims as in-progress
    rebinds deadlocked clusters that use WaitForFirstConsumer binding —
    a stuck Pod's unbound claim can never bind until the Pod schedules,
    the Pod can never schedule until its mis-pinned sibling claim is
    unbound, and the gate deferred exactly that unbind forever. A fresh
    cluster whose broker's shadow-index-cache PV was provisioned onto
    an already-occupied node never bootstrapped, with the unbinder
    logging "a PVC in this cluster has no volumeName yet; deferring"
    every 30s; the exemption is symmetric so multiple simultaneously
    mis-pinned brokers cannot mutually deadlock either. The exemption
    applies only under a strict proof chain: the Pod is stuck Pending
    past the unbind timeout, holds a Bound claim on a HostPath/Local PV
    whose every eligible node is provably unavailable (gone, cordoned,
    NotReady/unreachable net of unconditional tolerations — pods under
    --broker-pod-node-unavailable-toleration=-1s never treat transient
    unreachability as loss — or occupied by a pod matched by the stuck
    Pod's own hard hostname-scoped anti-affinity), the unbound claim
    resolves to a WaitForFirstConsumer StorageClass, and the reconciled
    Pod additionally holds its own mis-pin proof before any deletion
    proceeds. The occupancy-based proof requires a hard (Required)
    anti-affinity term scoped to the kubernetes.io/hostname topology
    in the pod's own namespace with no matchLabelKeys — terms are
    judged by that shape whether statefulset.podAntiAffinity type
    "hard" or "custom" produced them, while type "soft" yields no
    required terms and never qualifies (the other proof legs — node
    gone, cordoned, or unreachable — still apply); clusters deadlocked
    purely on an occupied node without such a term keep deferring,
    visible via the pvc-rebinding gate metric and Event. The
    two-victims-on-two-nodes variant of the same
    mis-provisioning is a known remaining gap: it defers at the
    multi-node gate instead and still requires manual PVC deletion.
    Orphaned claims with no Pod keep deferring the unbind,
    unbinder-initiated rebinds stay serialized by the in-flight gate's
    uncached settle check, the deferral log/Event now names the gating
    claim, every exemption-based gate pass that proceeds to remediation
    is recorded by a Warning PVCUnbinderGateExempted Event, a log
    line, and the new pvc_unbinder_gate_exempted_total metric (a pass
    still held by the freed-pv gate records that gate's deferral
    instead), and under the deprecated
    --allow-pv-rebinding flag the original conservative behavior (no
    exemption at all) is kept because freed Available PVs make acting
    while any claim is unbound unsafe. A new
    --disable-pvc-rebinding-gate-exemption flag (operator and sidecar;
    in the redpanda chart set
    `statefulset.sideCars.pvcUnbinder.disableStuckClaimExemption`)
    turns just the exemption off as an escape hatch while keeping the
    rest of the unbinder running. The unbinder's ClusterRole
    additionally grants nodes list and storageclasses get for the
    exemption's evidence reads; if RBAC is managed out-of-band and lags
    the upgrade, evidence reads fall back to the conservative deferral
    (fail-safe) rather than erroring.
