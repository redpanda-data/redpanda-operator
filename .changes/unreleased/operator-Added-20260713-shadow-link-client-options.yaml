project: operator
kind: Added
body: |-
    ShadowLink resources now expose `spec.clientOptions` for tuning the
    Kafka client the shadow cluster uses to fetch from the source
    cluster: `fetchMinBytes`, `fetchWaitMaxMs`, `fetchMaxBytes`,
    `fetchPartitionMaxBytes`, `metadataMaxAgeMs`, `connectionTimeoutMs`,
    and `retryBackoffMs`. These primarily trade replication latency
    against fetch batching efficiency. Each field is left at the broker
    default when unset (or set to 0), so existing ShadowLinks are
    unaffected.
time: 2026-07-13T12:00:00.000000-04:00
