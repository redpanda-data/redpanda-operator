kind: Fixed
body: |-
    The `resources.memory.enable_memory_locking` description no longer says to set it to `true` for production

      It now describes what memory locking does, that it applies only when `resources.requests` and
      `resources.limits` are both unset, and how to lock memory with `statefulset.additionalRedpandaCmdFlags`
      when they are set.
