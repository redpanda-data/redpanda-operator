body: |-
    `service.annotations` no longer publishes a description belonging to another value

      The Helm reference showed "Override the value in `console.config.server.listenPort`
      if not `nil`" for `service.annotations`. That text was written for the
      commented-out `service.targetPort` above it, and helm-docs attaches a marker to
      the next real key regardless of commented-out keys in between.
