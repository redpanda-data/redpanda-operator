project: charts/redpanda
kind: Added
body: |-
    New `commonAnnotations` value adds the given annotations to every object the chart renders, except the StatefulSet — its object, Pod template, and volume claim templates are left unannotated so the value can be added, changed, or removed on a live cluster without hitting the StatefulSet's immutable-field restrictions. Annotations set on an individual resource take precedence. Useful for policy-engine required annotations or ArgoCD sync waves, for example `argocd.argoproj.io/sync-wave: "1"`.
time: 2026-09-08T16:00:00.000000-07:00
