project: charts/redpanda
kind: Added
body: |-
    New `commonAnnotations` value adds the given annotations to every object the chart renders (except the StatefulSet Pod template, since annotating the Pods would restart the brokers), including the Console Secret, ConfigMap and Deployment. Annotations set on an individual resource take precedence. Use it for ArgoCD sync waves, for example `argocd.argoproj.io/sync-wave: "1"`. Console objects rendered by the console subchart's own templates take theirs from `console.commonAnnotations`.
time: 2026-09-08T16:00:00.000000-07:00
