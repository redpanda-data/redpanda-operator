project: operator
kind: Fixed
body: |-
    Upgrading the operator no longer rolls every broker just because the
    embedded redpanda chart's version changed. Broker pod templates no longer
    carry the `helm.sh/chart` label, and the sidecar's `--selector` no longer
    includes it. The upgrade to this release rolls brokers once to drop the
    label. Brokers still roll when their pod spec changes, such as a new
    sidecar image.
time: 2026-10-21T11:02:31.000000-04:00
