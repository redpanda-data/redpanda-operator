project: operator
kind: Fixed
body: |-
    A broker pod that could not start, for example one crash-looping after an upgrade, one whose image cannot be pulled, one stuck on a failing init container, one that can't be scheduled, such as one whose resource requests fit no node, or one whose startup probe has not passed in 10 minutes while other brokers report it down, could not be fixed by changing the cluster resource: every rolling-restart check waits for the cluster to be healthy, which it never is while that broker is down, so the pod had to be deleted by hand. The operator now replaces such a pod once its pod template changes, in StatefulSet and Broker CR mode. It replaces one pod at a time, never one whose broker other brokers still see running, and not while a pod already on the new template can't be scheduled, every broker on it is down, or no broker answers while some may be running, including ones the operator can't see. Healthy brokers still roll only once the cluster is healthy. In Broker CR mode, a roll grant that has expired is no longer renewed without a health check when the pod template changes.
