project: operator
kind: Added
body: 'The operator can now publish a Service''s EndpointSlices itself, deciding membership per port, so that a broker whose Schema Registry store is still replaying `_schemas` (its auth-exempt `GET /status/ready` not answering) is unpublished from the Schema Registry port while it keeps serving Kafka. Pod readiness is untouched, which is what makes this possible at all: broker discovery Services must publish not-ready addresses for Raft, so readiness cannot steer Schema Registry traffic. A Service opts in by carrying `cluster.redpanda.com/endpoints-for=<cluster name>` and no selector — the way to steer a Service the operator does not render, such as a load balancer Service, and the only way for StretchClusters, whose own Services are left to the native controller. The new `--enable-endpoint-steering` flag renders V1 (Cluster) and V2 (Redpanda) clusters'' own Services that way: the `<cluster>-cluster` Service on V1 and the internal Service on V2, the ones carrying each API''s Schema Registry listener. Broker pods are matched through the `app.kubernetes.io/instance` label they already carry, so enabling it restarts nothing.'
