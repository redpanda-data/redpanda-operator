project: operator
kind: Added
body: 'The operator can now manage a Service''s EndpointSlices itself, publishing each port of the Service for a different subset of brokers — per-listener readiness within a single Kubernetes Service, which pod readiness cannot express. It gates the Schema Registry ports today: a broker whose registry store is still replaying `_schemas` leaves the Schema Registry ports, internal and external, while it keeps serving Kafka. Opt in per cluster by annotating a Cluster (V1) or Redpanda (V2) with `operator.redpanda.com/enable-endpoint-steering=true`, which renders the Service carrying that cluster''s Schema Registry listener for steering — the `<cluster>-cluster` Service on V1, the internal Service on V2. Any other Service opts in by carrying `cluster.redpanda.com/endpoints-for=<cluster name>` and no selector, which is how to steer a Service the operator does not render, such as a load balancer Service. Broker pods are matched through the `app.kubernetes.io/instance` label they already carry, so enabling it restarts nothing. StretchClusters are not covered: a multicluster deployment leaves its Services to the native EndpointSlice controller.'
