project: operator
kind: Fixed
body: 'StretchCluster brokers now advertise their external address on external Kafka and HTTP Proxy listeners. The configurator wrote the bare pod name into the external entries of `advertised_kafka_api` and `advertised_pandaproxy_api`, so `external.domain` and `external.addresses` on a `RedpandaBrokerPool` only reached the ExternalDNS hostname of the per-broker `lb-<pool>-<ordinal>` Services and the certificate SANs. Each broker now advertises the same host as its LoadBalancer Service: its entry in `external.addresses`, the single shared address, or its pod name, followed by `.<external.domain>` when set, and only while `external.enabled` is true. `external.addresses` is now indexed per pool; before, every pool after the first in a Kubernetes cluster ignored its own list and its `lb-` Services fell back to pod names. Pools that set `external.domain` or `external.addresses` advertise the new address after the next broker restart, so DNS records must exist for those names. `prefixTemplate` is still ignored, as in the Redpanda Helm chart.'
