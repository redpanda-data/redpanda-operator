body: '`listeners.<api>.external.<listener-name>.nodePort` has no effect. It set the port of the LoadBalancer Service, but clients connect to the advertised port. The LoadBalancer Service now publishes the first entry of `advertisedPorts`. If `advertisedPorts` is empty, it publishes the port of the listener.'
