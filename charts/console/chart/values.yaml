# Default values for console.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of Console Pods to run. Ignored when `autoscaling.enabled` is
# `true`, in which case the HorizontalPodAutoscaler sets the count.
replicaCount: 1

# -- Redpanda Console Docker image settings.
image:
  registry: docker.redpanda.com
  # -- Docker repository from which to pull the Redpanda Docker image.
  repository: redpandadata/console
  # -- The imagePullPolicy.
  pullPolicy: IfNotPresent
  # -- The Redpanda Console version.
  # See DockerHub for:
  # [All stable versions](https://hub.docker.com/r/redpandadata/console/tags)
  # and [all unstable versions](https://hub.docker.com/r/redpandadata/console-unstable/tags).
  # @default -- `Chart.appVersion`
  tag: ""

# -- Pull secrets may be used to provide credentials to image repositories
# See https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# -- Override `console.name` template.
nameOverride: ""
# -- Override `console.fullname` template.
fullnameOverride: ""

# -- Automount API credentials for the Service Account into the pod. Console does not communicate with
# Kubernetes API.
automountServiceAccountToken: false

serviceAccount:
  # -- Specifies whether a service account should be created.
  create: true
  # -- Specifies whether a service account should automount API-Credentials. Console does not
  # communicate with Kubernetes API. The ServiceAccount could be used for workload identity.
  automountServiceAccountToken: false
  # -- Annotations to add to the service account.
  annotations: {}
  # -- The name of the service account to use.
  # If not set and `serviceAccount.create` is `true`,
  # a name is generated using the `console.fullname` template
  name: ""

# -- Common labels to add to all the Pods.
commonLabels: {}

# -- Annotations to add to the deployment.
annotations: {}

# -- Annotations to add to the Console Pods.
podAnnotations: {}

# -- Labels to add to the Console Pods.
podLabels: {}

# -- Pod-level security context for the Console Pods.
# For details,
# see the [Kubernetes documentation](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/).
podSecurityContext:
  runAsUser: 99
  fsGroup: 99
  fsGroupChangePolicy: 'Always'

# -- Container-level security context for the Console container.
# For details,
# see the [Kubernetes documentation](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/).
securityContext:
  runAsNonRoot: true
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- Type of Service created for Console. One of `ClusterIP`, `NodePort`, or
  # `LoadBalancer`. `nodePort` applies only when this is `NodePort`.
  type: ClusterIP
  # -- Port that the Console Service listens on.
  port: 8080
  # nodePort: 30001
  # -- Override the value in `console.config.server.listenPort` if not `nil`
  # targetPort:
  annotations: {}

ingress:
  # -- Whether to create an Ingress for Console.
  enabled: false
  # className:
  # -- Annotations to add to the Ingress, for example to select an ingress
  # controller or request a certificate. Applies only when `ingress.enabled`
  # is `true`.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Hosts and paths that the Ingress routes to Console. Applies only when
  # `ingress.enabled` is `true`.
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- TLS certificates for the Ingress, each entry naming a Secret and the
  # hosts it covers. Applies only when `ingress.enabled` is `true`.
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Gateway API `HTTPRoute` settings.
gateway:
  enabled: false
  annotations: {}
  # -- Gateway parent references for this route.
  # If no parentRefs are specified, the HTTPRoute is still rendered but will
  # not attach to any Gateway until configured.
  parentRefs: []
  #  - name: public-gateway
  #    namespace: default
  #    sectionName: http
  hostnames:
    - chart-example.local
  path: /
  # -- One of Exact, PathPrefix, or RegularExpression.
  pathType: PathPrefix

# -- Compute resources for the Console container. Left empty by default so
# that the chart runs on clusters with little capacity, which means Console
# runs without requests or limits until you set them.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as minikube. If you want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  # -- Whether to create a HorizontalPodAutoscaler for the Console Deployment.
  enabled: false
  # -- Minimum number of Console Pods the autoscaler scales down to. Applies
  # only when `autoscaling.enabled` is `true`.
  minReplicas: 1
  # -- Maximum number of Console Pods the autoscaler scales up to. Applies
  # only when `autoscaling.enabled` is `true`.
  maxReplicas: 100
  # -- Average CPU utilization the autoscaler targets, as a percentage of the
  # CPU request. Applies only when `autoscaling.enabled` is `true`.
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Node labels that the Console Pods must match to be scheduled.
nodeSelector: {}

# -- Taints that the Console Pods tolerate.
# For details,
# see the [Kubernetes documentation](https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
tolerations: []

# -- Affinity rules for scheduling the Console Pods.
# For details,
# see the [Kubernetes documentation](https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity).
affinity: {}

# -- Constraints on how the Console Pods are spread across failure domains.
# For details,
# see the [Kubernetes documentation](https://kubernetes.io/docs/concepts/workloads/pods/pod-topology-spread-constraints/).
topologySpreadConstraints: []

# -- PriorityClassName given to Pods.
# For details,
# see the [Kubernetes documentation](https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass).
priorityClassName: ""

# -- Settings for the `Config.yaml` (required).
# For a reference of configuration settings,
# see the [Redpanda Console documentation](https://docs.redpanda.com/docs/reference/console/config/).
config: {}

# -- Additional environment variables for the Redpanda Console Deployment.
extraEnv: []
  # - name: KAFKA_RACKID
  #   value: "1"

# -- Additional environment variables for Redpanda Console mapped from Secret or ConfigMap.
extraEnvFrom: []
# - secretRef:
#     name: console-config-secret

# -- Add additional volumes, such as for TLS keys.
extraVolumes: []
# - name: kafka-certs
#   secret:
#     secretName: kafka-certs
# - name: config
#   configMap:
#     name: console-config

# -- Add additional volume mounts, such as for TLS keys.
extraVolumeMounts: []
# - name: kafka-certs # Must match the volume name
#   mountPath: /etc/kafka/certs
#   readOnly: true

# -- Add additional containers, such as for oauth2-proxy.
extraContainers: []

# -- Add additional container ports to the console container.
# Useful when using multi-listener configuration.
extraContainerPorts: []
# - name: private
#   containerPort: 8081
#   protocol: TCP

# -- Any initContainers defined should be written here
initContainers:
  # -- Additional set of init containers
  extraInitContainers: |-
#    - name: "test-init-container"
#      image: "mintel/docker-alpine-bash-curl-jq:latest"
#      command: [ "/bin/bash", "-c" ]
#      args:
#        - |
#          set -xe
#          echo "Hello World!"

# -- SecretMounts is an abstraction to make a Secret available in the container's filesystem.
# Under the hood it creates a volume and a volume mount for the Redpanda Console container.
secretMounts: []
#  - name: kafka-certs
#    secretName: kafka-certs
#    path: /etc/console/certs
#    defaultMode: 0755

# -- Create a new Kubernetes Secret for all sensitive configuration inputs.
# Each provided Secret is mounted automatically and made available to the
# Pod.
# If you want to use one or more existing Secrets,
# you can use the `extraEnvFrom` list to mount environment variables from string and secretMounts to mount files such as Certificates from Secrets.
secret:
  create: true

  # Secret values in case you want the chart to create a Secret. All Certificates are mounted
  # as files and the path to those files are configured through environment variables so
  # that Console can automatically pick them up.
  # -- Kafka Secrets.
  kafka: {}
    # saslPassword:
    # awsMskIamSecretKey:
    # tlsCa:
    # tlsCert:
    # tlsKey:
    # tlsPassphrase:
   
  schemaRegistry: {}
    # password:
    # tlsCa:
    # tlsCert:
    # tlsKey:

  # Enterprise version secrets
  # - SSO secrets (Enterprise version).
  authentication:
    # Configurable JWT value
    jwtSigningKey: ""
    oidc: {}
      # clientSecret:

  serde: {}
    # protobufGitBasicAuthPassword

  license: ""

  redpanda:
    adminApi: {}
      # password:
      # tlsCa:
      # tlsCert:
      # tlsKey:

# -- Settings for license key, as an alternative to secret.enterprise when
# a license secret is available
# licenseSecretRef:
#   name: my-secret
#   key: key-where-license-is-stored

# -- Settings for liveness and readiness probes.
# For details,
# see the [Kubernetes documentation](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes).
livenessProbe:
  # initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

# -- Readiness probe for the Console container.
# For details,
# see the [Kubernetes documentation](https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-probes).
readinessProbe:
  # -- Grant time to test connectivity to upstream services such as Kafka and Schema Registry.
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

configmap:
  # -- Whether to render the ConfigMap that holds Console's configuration.
  create: true
deployment:
  # -- Whether to render the Console Deployment.
  create: true

# -- Update strategy for the Console Deployment. Leave empty to use the
# Kubernetes default, `RollingUpdate`.
# For details,
# see the [Kubernetes documentation](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy).
strategy: {}

tests:
  enabled: true

monitoring:
  # -- Whether to create a ServiceMonitor for Console's metrics endpoint.
  enabled: false
  # -- How often Prometheus scrapes Console's metrics endpoint. Applies only
  # when `monitoring.enabled` is `true`.
  scrapeInterval: "1m"
  # -- Labels to add to the ServiceMonitor, so that a Prometheus instance can
  # select it. Applies only when `monitoring.enabled` is `true`.
  labels: {}
