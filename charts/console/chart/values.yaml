# Default values for console.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# -- Redpanda Console Docker image settings.
image:
  registry: docker.redpanda.com
  # -- Docker repository from which to pull the Redpanda Docker image.
  repository: redpandadata/console
  # -- The imagePullPolicy.
  pullPolicy: IfNotPresent
  # -- The Redpanda Console version.
  # See DockerHub for:
  # [All stable versions](https://hub.docker.com/r/redpandadata/console/tags)
  # and [all unstable versions](https://hub.docker.com/r/redpandadata/console-unstable/tags).
  # @default -- `Chart.appVersion`
  tag: ""

# -- Pull secrets may be used to provide credentials to image repositories
# See https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# -- Override `console.name` template.
nameOverride: ""
# -- Override `console.fullname` template.
fullnameOverride: ""

# -- Automount API credentials for the Service Account into the pod. Console calls the Kubernetes API only
# for `pipelines`, which mounts the credentials regardless of this setting.
automountServiceAccountToken: false

serviceAccount:
  # -- Specifies whether a service account should be created.
  create: true
  # -- Specifies whether a service account should automount API-Credentials. Console calls the
  # Kubernetes API only for `pipelines`. The ServiceAccount could be used for workload identity.
  automountServiceAccountToken: false
  # -- Annotations to add to the service account.
  annotations: {}
  # -- The name of the service account to use.
  # If not set and `serviceAccount.create` is `true`,
  # a name is generated using the `console.fullname` template
  name: ""

# Common labels to add to all the pods
commonLabels: {}

# -- Annotations to add to the deployment.
annotations: {}

podAnnotations: {}

podLabels: {}

podSecurityContext:
  runAsUser: 99
  fsGroup: 99
  fsGroupChangePolicy: 'Always'

securityContext:
  runAsNonRoot: true
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080
  # nodePort: 30001
  # -- Override the value in `console.config.server.listenPort` if not `nil`
  # targetPort:
  # -- Annotations to add to the Console Service.
  annotations: {}

ingress:
  enabled: false
  # className:
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Gateway API `HTTPRoute` settings.
gateway:
  enabled: false
  annotations: {}
  # -- Gateway parent references for this route.
  # If no parentRefs are specified, the HTTPRoute is still rendered but will
  # not attach to any Gateway until configured.
  parentRefs: []
  #  - name: public-gateway
  #    namespace: default
  #    sectionName: http
  hostnames:
    - chart-example.local
  path: /
  # -- One of Exact, PathPrefix, or RegularExpression.
  pathType: PathPrefix

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as minikube. If you want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

topologySpreadConstraints: []

# -- PriorityClassName given to Pods.
# For details,
# see the [Kubernetes documentation](https://kubernetes.io/docs/concepts/configuration/pod-priority-preemption/#priorityclass).
priorityClassName: ""

# -- Settings for the `Config.yaml` (required).
# For a reference of configuration settings,
# see the [Redpanda Console documentation](https://docs.redpanda.com/docs/reference/console/config/).
config: {}

# -- Additional environment variables for the Redpanda Console Deployment.
extraEnv: []
  # - name: KAFKA_RACKID
  #   value: "1"

# -- Additional environment variables for Redpanda Console mapped from Secret or ConfigMap.
extraEnvFrom: []
# - secretRef:
#     name: console-config-secret

# -- Add additional volumes, such as for TLS keys.
extraVolumes: []
# - name: kafka-certs
#   secret:
#     secretName: kafka-certs
# - name: config
#   configMap:
#     name: console-config

# -- Add additional volume mounts, such as for TLS keys.
extraVolumeMounts: []
# - name: kafka-certs # Must match the volume name
#   mountPath: /etc/kafka/certs
#   readOnly: true

# -- Add additional containers, such as for oauth2-proxy.
extraContainers: []

# -- Add additional container ports to the console container.
# Useful when using multi-listener configuration.
extraContainerPorts: []
# - name: private
#   containerPort: 8081
#   protocol: TCP

# -- Any initContainers defined should be written here
initContainers:
  # -- Additional set of init containers
  extraInitContainers: |-
#    - name: "test-init-container"
#      image: "mintel/docker-alpine-bash-curl-jq:latest"
#      command: [ "/bin/bash", "-c" ]
#      args:
#        - |
#          set -xe
#          echo "Hello World!"

# -- SecretMounts is an abstraction to make a Secret available in the container's filesystem.
# Under the hood it creates a volume and a volume mount for the Redpanda Console container.
secretMounts: []
#  - name: kafka-certs
#    secretName: kafka-certs
#    path: /etc/console/certs
#    defaultMode: 0755

# -- Create a new Kubernetes Secret for all sensitive configuration inputs.
# Each provided Secret is mounted automatically and made available to the
# Pod.
# If you want to use one or more existing Secrets,
# you can use the `extraEnvFrom` list to mount environment variables from string and secretMounts to mount files such as Certificates from Secrets.
secret:
  create: true

  # Secret values in case you want the chart to create a Secret. All Certificates are mounted
  # as files and the path to those files are configured through environment variables so
  # that Console can automatically pick them up.
  # -- Kafka Secrets.
  kafka: {}
    # saslPassword:
    # awsMskIamSecretKey:
    # tlsCa:
    # tlsCert:
    # tlsKey:
    # tlsPassphrase:
   
  schemaRegistry: {}
    # password:
    # tlsCa:
    # tlsCert:
    # tlsKey:

  # Enterprise version secrets
  # - SSO secrets (Enterprise version).
  authentication:
    # Configurable JWT value
    jwtSigningKey: ""
    oidc: {}
      # clientSecret:

  serde: {}
    # protobufGitBasicAuthPassword

  license: ""

  redpanda:
    adminApi: {}
      # password:
      # tlsCa:
      # tlsCert:
      # tlsKey:

# -- Settings for license key, as an alternative to secret.enterprise when
# a license secret is available
# licenseSecretRef:
#   name: my-secret
#   key: key-where-license-is-stored

# -- Settings for liveness and readiness probes.
# For details,
# see the [Kubernetes documentation](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes).
livenessProbe:
  # initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  # -- Grant time to test connectivity to upstream services such as Kafka and Schema Registry.
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 1
  successThreshold: 1
  failureThreshold: 3

configmap:
  create: true
deployment:
  create: true

strategy: {}

tests:
  enabled: true

monitoring:
  enabled: false
  scrapeInterval: "1m"
  labels: {}

# -- Lets Console manage Redpanda Connect pipelines that run as Pipeline resources.
# The Redpanda Operator runs the Pipelines, so it must run with `connectController.enabled: true`.
# When enabled, the chart sets `config.pipelines.kubernetes` from these values, overriding the same keys in `config`,
# and mounts the ServiceAccount token and cluster CA into the Console Pods so Console can call the Kubernetes API.
# Anyone who can create pipelines in Console can run arbitrary code in `namespace`, because Connect configs can run commands and read files in the pipeline Pods.
# Enforce the Pod Security Admission `restricted` level on `namespace`, and set a ResourceQuota and LimitRange there,
# because Console may set any `replicas` and any cpu and memory quantity.
# Run one Console per pipelines namespace: every Console labels its Pipelines `console.redpanda.com/managed-by: console`,
# so Consoles that share a namespace can edit and delete each other's pipelines.
pipelines:
  # -- Enables pipeline management in Console.
  # Unless `impersonateUser` is `true`, the chart also grants Console's ServiceAccount access to Pipelines in `namespace`
  # with a Role and RoleBinding named `<fullname>-pipelines`. Console then needs its own ServiceAccount:
  # the chart fails to render if it would use the namespace's `default` ServiceAccount, which pipeline Pods share.
  enabled: false
  # -- Namespace of the Pipelines that Console reads and writes.
  # Defaults to the release namespace.
  namespace: ""
  # -- Name of the Redpanda resource that pipelines created in Console connect to, set as their `spec.cluster.clusterRef.name`.
  # The Redpanda resource must be in `namespace`.
  # If empty, Console creates pipelines without a cluster reference.
  # Requires `userRef`, unless `allowBootstrapUser` is `true`.
  clusterRef: ""
  # -- Name of the User resource that pipelines created in Console authenticate as, set as their `spec.userRef.name`.
  # The User must be in `namespace` and have ACLs for the topics, consumer groups, and schema subjects that the pipelines use,
  # plus Write and Describe on the topic `__redpanda.connect.logs` for Console to show pipeline logs.
  # Every pipeline created in Console runs as this User, so its ACLs bound what anyone who can create pipelines in Console can read and write,
  # regardless of their own Console permissions. Keep them narrow.
  # If the cluster's internal Kafka listener uses `authenticationMethod: mtls_identity`, a pipeline can instead authenticate
  # with the client certificate that the operator and Console also use, which this User's ACLs don't bound. Use SASL on that listener.
  userRef: ""
  # -- Lets pipelines created in Console run without `userRef`, in which case they authenticate as the cluster's bootstrap superuser
  # if the cluster has SASL enabled. Set it only for clusters without SASL.
  allowBootstrapUser: false
  # -- Forwards the logged-in user's OIDC ID token to the Kubernetes API instead of using Console's ServiceAccount,
  # so Kubernetes RBAC and audit logs apply to each user. Requires the API server to trust Console's identity provider.
  # Console's ServiceAccount then gets no access to Pipelines. Instead, the chart creates the ClusterRoles
  # `<fullname>-<hash>-pipeline-editor` and `<fullname>-<hash>-pipeline-viewer`, where `<hash>` is derived from the release's namespace and name,
  # for you to bind to your identity provider's groups, for example with a RoleBinding in `namespace`.
  # No admission policy applies in this mode, so `-pipeline-editor` lets its members set any Pipeline field, such as `image`,
  # `serviceAccountName`, `valueSources`, and `extraVolumes`, and omit `userRef`. That amounts to creating Pods and reading Secrets in `namespace`,
  # and to authenticating as the cluster's bootstrap superuser.
  impersonateUser: false
  # -- Lets Console manage pipelines without authenticating its users, which Console otherwise refuses.
  # Set it only for Consoles with authentication handled in front of them: anyone who can reach Console can otherwise run workloads in the cluster.
  allowUnauthenticated: false
  admissionPolicy:
    # -- Creates a ValidatingAdmissionPolicy that limits what Console's ServiceAccount can write, so a compromised Console can't run arbitrary Pods.
    # It rejects writes that add or change Pipeline fields other than `configYaml`, `displayName`, `description`, `tags`, `paused`, `replicas`, `updateStrategy`,
    # cpu and memory in `resources.requests` and `resources.limits`, `cluster.clusterRef.name`, which must equal `clusterRef`,
    # and `userRef.name`, which must equal `userRef`. Unless `allowBootstrapUser` is `true`, it also requires `userRef` on Pipelines that set `cluster`.
    # It also rejects writes to Pipelines without the label `console.redpanda.com/managed-by: console`,
    # and writes that set `metadata.ownerReferences` or add or remove `metadata.finalizers`.
    # Requires Kubernetes 1.30 or later. Has no effect when `impersonateUser` is `true`.
    # Console refuses to start through its ServiceAccount if the policy is missing, unless this is `false`.
    # Helm installs ValidatingAdmissionPolicies after the Role that grants Console access to Pipelines,
    # so install and upgrade with `--atomic`, or check that the policy exists, to roll back if the policy fails to install.
    enabled: true
