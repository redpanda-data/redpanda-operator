# This file describes the unified cluster statuses generated for v1 and v2
# it's used by gen status to generate consistently typed structures for our errors.
# 
# It should remain heavily documented to demonstrate usage.
# 
# General usage:
# 
#    status := statuses.NewMyKind()
#    status.SetMyCondition(statues.MyKindMyConditionMyReason, "something happened!") // or don't pass any strings for reasons that have default messages
# 
#    // for server side applies you can do
#    kubernetes.ApplyPatch(config.WithStatus(mypackageac.SchemaStatus()
#      .WithConditions(status.StatusConditionConfigs(myKind)...)))
# 
#    // or for a standard update (internally this acts like apimeta.SetStatusCondition)
#    if status.UpdateConditions(myKind) { client.Update(...) }

# kind is the name of the status struct, here we'll generate a struct named "Cluster"
- kind: Cluster
  # appliesTo allows us to generate struct and field kubebuilder annotations to default our conditions in our API structs
  appliesTo:
    - redpanda/v1alpha2/Redpanda
  # description is the description to add for this struct as a doc comment
  description:
    Defines the observed status conditions of a cluster.
  # errors are reasons injected onto every status condition other than "final" or "rolled-up" conditions
  # both of which should be calculated *any* time a condition has changed due to being summaries of current
  # state.
  # 
  # Any error not marked "transient" is considered "terminal" in that setting one will cause any "final" conditions
  # to now be true rather than false. Use terminal errors when you know you don't want to reschedule reconciliation
  # and transient errors when you do.
  errors:
    - name: Error
      transient: true
      description: >
        This reason is used when a cluster has only been partially reconciled and we have early returned
        due to a retryable error occurring prior to applying the desired cluster state. If it is set on
        any non-final condition, then the condition "Quiesced" will be False with a reason of "SillReconciling".
    - name: TerminalError
      description: >
        This reason is used when a cluster has only been partially reconciled and we have early returned
        due to a known terminal error occurring prior to applying the desired cluster state. Because the cluster
        should no longer be reconciled when a terminal error occurs, the "Quiesced" status should be set to True.
  # conditions are all of the conditions that will be added to the struct
  conditions:
    - name: Ready
      # printerColumns allows us to inject kubebuilder annotations into our struct that reflect on this condition
      printerColumns:
        - name: Ready
        - name: Status
          message: true
      description: >
        This condition indicates whether a cluster is ready to serve any
        traffic. This can happen, for example if a cluster is partially degraded
        but still can process requests.

        This condition defaults to "Unknown" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a
        cluster.
      # reasons are the reasons associated with the condition.
      # 
      # The first reason in this list implictly becomes the "True" condition and should most
      # likely contain a default message that is unlikely to be overridden. For example:
      # 
      #   clusterStatus.SetReady(statuses.ClusterReadyReady)
      # 
      # Any subsequent reasons evaluate to "False" and should likely be used with context
      # as to why they are set, for example:
      # 
      #   clusterStatus.SetReady(statuses.ClusterReadyNotReady, "resources not yet initially synced")
      reasons:
        - name: Ready
          message: Cluster ready to service requests
          description: >
            This reason is used with the "Ready" condition when it evaluates to True because
            a cluster can service traffic.
        - name: NotReady
          description: >
            This reason is used with the "Ready" condition when it evaluates to False because
            a cluster is not ready to service traffic.
    - name: Healthy
      description: >
        This condition indicates whether a cluster is healthy as defined by the Redpanda Admin
        API's cluster health endpoint.

        This condition defaults to "Unknown" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a
        cluster.
      reasons:
        - name: Healthy
          message: Cluster is healthy
          description: >
            This reason is used with the "Healthy" condition when it evaluates to True because
            a cluster's health endpoint says the cluster is healthy.
        - name: NotHealthy
          description: >
            This reason is used with the "Healthy" condition when it evaluates to False because
            a cluster's health endpoint says the cluster is not healthy.
    - name: LicenseValid
      rateLimit: 5 * time.Minute
      printerColumns:
        - name: License
          message: true
      description: >
        This condition indicates whether a cluster has a valid license.

        This condition defaults to "Unknown" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a
        cluster.
      reasons:
        - name: Valid
          message: Cluster has a valid license
          description: >
            This reason is used with the "LicenseValid" condition when it evaluates to True because
            a cluster has a valid license.
        - name: Expired
          message: Cluster license has expired
          description: >
            This reason is used with the "LicenseValid" condition when it evaluates to False because
            a cluster has an expired license.
        - name: NotPresent
          message: No cluster license is present
          description: >
            This reason is used with the "LicenseValid" condition when it evaluates to False because
            a cluster has no license.
    - name: ResourcesSynced
      description: >
        This condition indicates whether the Kubernetes resources for a cluster
        have been synchronized.

        This condition defaults to "False" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a
        cluster.
      reasons:
        - name: Synced
          message: Cluster resources successfully synced
          description: >
            This reason is used with the "ResourcesSynced" condition when it evaluates to True because
            a cluster has had all of its Kubernetes resources synced.
    - name: ConfigurationApplied
      description: >
        This condition indicates whether cluster configuration parameters
        have currently been applied to a cluster for the given generation.

        This condition defaults to "False" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a
        cluster.
      rateLimit: 5 * time.Minute
      reasons:
        - name: Applied
          message: Cluster configuration successfully applied
          description: >
            This reason is used with the "ConfigurationApplied" condition when it evaluates to True because
            a cluster has had its cluster configuration parameters applied.
        - name: NotApplied
          message: Cluster configuration not applied
          description: >
            This reason is used with the "ConfigurationApplied" condition when it evaluates to False due to
            some implementation-specific condition, such as when no brokers have been created and thus we can't
            attempt a configuration.
    - name: Quiesced
      # final means that this state basically can only be set when all other standard fields are set, you never
      # have to set it manually and it is always calculated in the internal call to Conditions().
      # 
      # Final conditions must have only two reasons, the first being for when all standard conditions are in a 
      # finalized state (i.e. they have no transient errors), and the second being for when there are transient
      # errors or an early return which has not set all conditions.
      final: true
      description: >
        This condition is used as to indicate that the cluster is no longer reconciling
        due to it being in a finalized state for the current generation.

        This condition defaults to "False" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a
        cluster.
      reasons:
        - name: Quiesced
          message: Cluster reconciliation finished
          description: >
            This reason is used with the "Quiesced" condition when it evaluates to True because
            the operator has finished reconciling the cluster at its current generation.
        - name: StillReconciling
          message: Cluster still reconciling
          description: >
            This reason is used with the "Quiesced" condition when it evaluates to False because
            the operator has not finished reconciling the cluster at its current generation.
            This can happen when, for example, we're doing a cluster scaling operation or a non-terminal
            error has been encountered during reconciliation.
    - name: Stable
      # rollup specifies this condition as a "rolled-up" condition, meaning it's calculated based
      # off of all referenced conditions being true.
      # 
      # Rolled-up conditions are calculated at the very end of our Conditions() call and shouldn't
      # ever reference other rolled-up conditions. Like final conditions, they must have two reason
      # one when the upstream conditions all evaluate to true, one for when they don't.
      rollup: [ Quiesced, Ready, ResourcesSynced, ConfigurationApplied ]
      description: >
        This condition is used as a roll-up status for any sort of automation such as
        terraform.

        This condition defaults to "False" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a
        cluster.
      reasons:
        - name: Stable
          message: Cluster Stable
          description: >
            This reason is used with the "Stable" condition when it evaluates to True because
            all dependent conditions also evaluate to True.
        - name: Unstable
          message: Cluster Unstable
          description: >
            This reason is used with the "Stable" condition when it evaluates to True because
            at least one dependent condition evaluates to False.
- kind: NodePool
  appliesTo:
    - redpanda/v1alpha2/NodePool
  description:
    Defines the observed status conditions of a node pool.
  errors:
    - name: Error
      transient: true
      description: >
        This reason is used when a node pool has only been partially reconciled and we have early returned
        due to a retryable error occurring prior to applying the desired node pool state.
    - name: TerminalError
      description: >
        This reason is used when a node pool has only been partially reconciled and we have early returned
        due to a known terminal error occurring prior to applying the desired node pool state.
  conditions:
    - name: Bound
      printerColumns:
        - name: Bound
      description: >
        This condition indicates whether a node pool is bound to a known Redpanda cluster.

        This condition defaults to "Unknown" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a
        node pool.
      reasons:
        - name: Bound
          message: Node pool successfully bound to cluster
          description: >
            This reason is used with the "Bound" condition when it evaluates to True because
            a node pool is bound to a cluster.
        - name: NotBound
          message: Node pool not bound to cluster
          description: >
            This reason is used with the "Bound" condition when it evaluates to False because
            a node pool is not bound to a cluster.
    - name: Deployed
      printerColumns:
        - name: Deployed
      description: >
        This condition indicates whether a node pool has been deployed for a known Redpanda cluster.

        This condition defaults to "Unknown" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a
        node pool.
      reasons:
        - name: Deployed
          message: Node pool successfully deployed to cluster
          description: >
            This reason is used with the "Deployed" condition when it evaluates to True because
            a node pool has been fully deployed for a cluster.
        - name: Scaling
          message: Node pool is scaling
          description: >
            This reason is used with the "Deployed" condition when it evaluates to False because
            a node pool has not yet been fully deployed for a cluster.
        - name: NotDeployed
          message: Node pool not deployed to cluster
          description: >
            This reason is used with the "Deployed" condition when it evaluates to False because
            a node pool has not started to deploy for a cluster.
    - name: Quiesced
      final: true
      description: >
        This condition is used as to indicate that the node pool is no longer reconciling
        due to it being in a finalized state for the current generation.

        This condition defaults to "False" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a
        node pool.
      reasons:
        - name: Quiesced
          message: Node pool reconciliation finished
          description: >
            This reason is used with the "Quiesced" condition when it evaluates to True because
            the operator has finished reconciling the node pool at its current generation.
        - name: StillReconciling
          message: Node pool still reconciling
          description: >
            This reason is used with the "Quiesced" condition when it evaluates to False because
            the operator has not finished reconciling the node pool at its current generation.
    - name: Stable
      rollup: [ Bound, Deployed, Quiesced ]
      description: >
        This condition is used as a roll-up status for any sort of automation such as
        terraform.

        This condition defaults to "False" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a
        node pool.
      reasons:
        - name: Stable
          message: Node pool stable
          description: >
            This reason is used with the "Stable" condition when it evaluates to True because
            all dependent conditions also evaluate to True.
        - name: Unstable
          message: Node pool unstable
          description: >
            This reason is used with the "Stable" condition when it evaluates to True because
            at least one dependent condition evaluates to False.
- kind: Broker
  appliesTo:
    - redpanda/v1alpha2/Broker
  description:
    Defines the observed status conditions of a single broker.
  errors:
    - name: Error
      transient: true
      description: >
        This reason is used when a broker has only been partially reconciled and we have early returned
        due to a retryable error occurring prior to applying the desired broker state.
    - name: TerminalError
      description: >
        This reason is used when a broker has encountered a terminal error
        and will not be reconciled further.
  conditions:
    - name: Ready
      printerColumns:
        - name: Ready
      description: >
        This condition indicates whether the broker's pod is running and healthy
        (containers started, liveness probe passing). It does not imply cluster
        membership — see BrokerRegistered for that. It is also independent of the
        pod's Kubernetes readiness probe, which reflects overall cluster health via
        rpk cluster health and may be false even when this specific broker is
        serving data.

        This condition defaults to "Unknown" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a broker.
      reasons:
        - name: Ready
          message: Broker pod is running and healthy
          description: >
            This reason is used with the "Ready" condition when it evaluates to True because
            the broker's pod is running and healthy.
        - name: NotReady
          description: >
            This reason is used with the "Ready" condition when it evaluates to False because
            the broker's pod is not yet running or healthy (e.g. crash loop, liveness failure).
    - name: PodScheduled
      description: >
        This condition indicates whether the broker's pod has been scheduled to a node.
        False when the pod is stuck due to node affinity, resource constraints, or PV affinity.

        This condition defaults to "Unknown" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a broker.
      reasons:
        - name: Scheduled
          message: Pod scheduled to node
          description: >
            This reason is used with the "PodScheduled" condition when it evaluates to True because
            the broker's pod has been scheduled to a Kubernetes node.
        - name: Unschedulable
          description: >
            This reason is used with the "PodScheduled" condition when it evaluates to False because
            the broker's pod cannot be scheduled (e.g. node affinity, insufficient resources).
        - name: PodMissing
          description: >
            This reason is used with the "PodScheduled" condition when it evaluates to False because
            the broker's pod does not exist (initial bootstrap, mid-rotation, or after decommission).
    - name: StorageBound
      description: >
        This condition indicates whether all PVCs for this broker are bound to PVs.

        This condition defaults to "Unknown" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a broker.
      reasons:
        - name: Bound
          message: All PVCs bound
          description: >
            This reason is used with the "StorageBound" condition when it evaluates to True because
            all PVCs for this broker are bound to PVs.
        - name: Pending
          description: >
            This reason is used with the "StorageBound" condition when it evaluates to False because
            one or more PVCs for this broker are not yet bound.
    - name: BrokerRegistered
      description: >
        This condition indicates whether the broker's node_id has been discovered via the
        admin API, confirming it has joined the Raft group. This is orthogonal to the
        Ready condition, which tracks pod health only. A broker can be Ready (pod
        running) but not yet BrokerRegistered (still joining the cluster), or
        BrokerRegistered but not Ready (pod crashed after initial registration).

        This condition defaults to "Unknown" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a broker.
      reasons:
        - name: Registered
          message: Broker registered with cluster
          description: >
            This reason is used with the "BrokerRegistered" condition when it evaluates to True because
            the broker has registered its node_id with the cluster.
        - name: NotRegistered
          description: >
            This reason is used with the "BrokerRegistered" condition when it evaluates to False because
            the broker has not yet registered with the cluster.
        - name: IdentityChanged
          description: >
            This reason is used with the "BrokerRegistered" condition when it evaluates to False because
            the broker's pod re-registered under a different node_id than previously recorded — its
            data directory did not survive. This requires an operator decision (replace the broker)
            rather than silent adoption of the new identity.
    - name: ConfigSynced
      description: >
        This condition indicates whether the broker's pod matches the desired pod template:
        both the config checksum and the restart-requiring cluster-config version. False means
        a rotation is pending (the pod will be recreated once the broker holds a valid roll-grant).

        This condition defaults to "Unknown" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a broker.
      reasons:
        - name: Synced
          message: Pod config matches desired
          description: >
            This reason is used with the "ConfigSynced" condition when it evaluates to True because
            the pod's config checksum and cluster-config version match the desired pod template.
        - name: Outdated
          description: >
            This reason is used with the "ConfigSynced" condition when it evaluates to False because
            the pod's config checksum or cluster-config version differs from the desired pod
            template and the pod awaits rotation.
    - name: Quiesced
      final: true
      description: >
        This condition indicates the broker is no longer reconciling for its current generation.

        This condition defaults to "False" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a broker.
      reasons:
        - name: Quiesced
          message: Broker reconciliation finished
          description: >
            This reason is used with the "Quiesced" condition when it evaluates to True because
            the operator has finished reconciling the broker at its current generation.
        - name: StillReconciling
          message: Broker still reconciling
          description: >
            This reason is used with the "Quiesced" condition when it evaluates to False because
            the operator has not finished reconciling the broker at its current generation.
    - name: Stable
      rollup: [ Ready, StorageBound, BrokerRegistered, ConfigSynced, Quiesced ]
      description: >
        This condition is a roll-up status for automation (e.g. parent controller checking
        all brokers are stable before proceeding). It is True when Ready, StorageBound,
        BrokerRegistered, ConfigSynced, and Quiesced all evaluate to True. Each tracks one
        dimension: Ready = pod health, StorageBound = PVC binding, BrokerRegistered = cluster
        membership, ConfigSynced = no rotation pending, Quiesced = reconciliation complete.

        This condition defaults to "False" with a reason of "NotReconciled"
        and must be set by a controller when it subsequently reconciles a broker.
      reasons:
        - name: Stable
          message: Broker stable
          description: >
            This reason is used with the "Stable" condition when it evaluates to True because
            Ready, StorageBound, BrokerRegistered, ConfigSynced, and Quiesced all evaluate to True.
        - name: Unstable
          message: Broker unstable
          description: >
            This reason is used with the "Stable" condition when it evaluates to False because
            at least one of Ready, StorageBound, BrokerRegistered, ConfigSynced, or Quiesced
            evaluates to False.