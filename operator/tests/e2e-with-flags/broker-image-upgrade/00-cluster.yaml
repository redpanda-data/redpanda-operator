# Broker-mode image upgrade: the Cluster is born with the migrate-to-broker-cr
# annotation, so the operator manages Broker CRs instead of a StatefulSet.
apiVersion: redpanda.vectorized.io/v1alpha1
kind: Cluster
metadata:
  name: broker-upgrade
  annotations:
    operator.redpanda.com/migrate-to-broker-cr: "true"
spec:
  image: "redpandadata/redpanda"
  version: "v24.2.24"
  replicas: 3
  restartConfig:
    underReplicatedPartitionThreshold: 0
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "100m"
      memory: 256Mi
    redpanda:
      memory: 217Mi
  configuration:
    rpcServer:
      port: 33145
    kafkaApi:
      - port: 9092
    adminApi:
      - port: 9644
    developerMode: true
    additionalCommandlineArguments:
      dump-memory-diagnostics-on-alloc-failure-kind: all
      abort-on-seastar-bad-alloc: ''
