# Broker-mode image upgrade: the Cluster is born with the use-broker-cr
# annotation, so the operator manages Broker CRs instead of a StatefulSet.
# The external listener behind a subdomain is the shape of every Redpanda
# Cloud cluster: the configurator must advertise the NodePort Service's port
# and status.nodes.external needs the ordinal of pods without a generateName.
apiVersion: redpanda.vectorized.io/v1alpha1
kind: Cluster
metadata:
  name: broker-upgrade
  annotations:
    operator.redpanda.com/use-broker-cr: "true"
spec:
  image: "redpandadata/redpanda"
  version: "v24.2.24"
  replicas: 3
  restartConfig:
    underReplicatedPartitionThreshold: 0
  resources:
    requests:
      cpu: "100m"
      memory: 256Mi
    limits:
      cpu: "100m"
      memory: 256Mi
    redpanda:
      memory: 217Mi
  configuration:
    rpcServer:
      port: 33145
    kafkaApi:
      - port: 9092
      - port: 30001
        external:
          enabled: true
          subdomain: "test.subdomain.com"
    adminApi:
      - port: 9644
    developerMode: true
    additionalCommandlineArguments:
      dump-memory-diagnostics-on-alloc-failure-kind: all
      abort-on-seastar-bad-alloc: ''
