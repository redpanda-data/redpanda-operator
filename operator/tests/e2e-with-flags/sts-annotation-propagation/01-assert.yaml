apiVersion: kuttl.dev/v1beta1
kind: TestAssert
commands:
- timeout: 320
  script: |
    set -e
    SEL="app.kubernetes.io/instance=sts-annotation"
    # The annotation must eventually reach the PODS (via rotation or patch).
    for i in $(seq 1 150); do
      count=$(kubectl get pods -n $NAMESPACE -l $SEL -o jsonpath='{range .items[*]}{.metadata.annotations.test\.redpanda\.com/propagation}{"\n"}{end}' 2>/dev/null | grep -c works || true)
      ready=$(kubectl get pods -n $NAMESPACE -l $SEL -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' 2>/dev/null | grep -c True || true)
      [ "$count" = "3" ] && [ "$ready" = "3" ] && exit 0
      sleep 2
    done
    echo "=== annotation never reached the pods ==="
    echo "--- Broker podTemplate annotations (synced correctly):"
    kubectl get brokers.cluster.redpanda.com -n $NAMESPACE -l $SEL -o jsonpath='{range .items[*]}{.metadata.name}: {.spec.podTemplate.annotations}{"\n"}{end}'
    echo "--- live pod annotations (missing it):"
    kubectl get pods -n $NAMESPACE -l $SEL -o jsonpath='{range .items[*]}{.metadata.name}: {.metadata.annotations}{"\n"}{end}'
    exit 1
