apiVersion: redpanda.vectorized.io/v1alpha1
kind: Console
metadata:
  name: console
spec:
  server:
    listenPort: 8080
  schema:
    enabled: true
  clusterRef:
    name: cluster
    namespace: default
  deployment:
    image: redpandadata/console:v2.8.16
  connect:
    enabled: true
    clusters:
    - name: console-connector
      url:  http://localhost:8083
      tls:
        enabled: true
        secretKeyRef:
          name: connector-tls
          namespace: default
