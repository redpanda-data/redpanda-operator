version: '3'

tasks:
  generate:
    desc: "Run all file generation tasks"
    deps:
      # console, operator and connectors share no inputs, so they can be
      # generated in parallel.
    - generate:console
    - generate:operator
    - generate:connectors
    cmds:
      - task: generate:redpanda
      - task: generate:readmes

  # Generate chart README.md's
  generate:readmes:
    internal: true
    sources:
    - ./charts/connectors/*.yaml
    - ./charts/connectors/README.md.gotmpl
    - ./charts/console/chart/*.yaml
    - ./charts/console/chart/README.md.gotmpl
    - ./charts/redpanda/chart/*.yaml
    - ./charts/redpanda/chart/README.md.gotmpl
    - ./operator/chart/*.yaml
    - ./operator/chart/README.md.gotmpl
    generates:
    - ./charts/connectors/README.md
    - ./charts/console/chart/README.md
    - ./charts/redpanda/chart/README.md
    - ./operator/chart/README.md
    cmds:
    - helm-docs --chart-to-generate charts/connectors,charts/console/chart,operator/chart,charts/redpanda/chart

  generate:console:
    desc: "Generate files for the console Helm chart"
    cmds:
    - task: generate:console:config
    - task: genpartial
      vars: { CHART: console, STRUCT: RenderValues }
    - task: genpartial
      vars: { CHART: console/chart }
    - task: genschema
      vars: { CHART: console, DIR: charts/console/chart }
    - task: gotohelm
      vars: { CHART: console/chart, BUNDLE: ['github.com/redpanda-data/redpanda-operator/charts/console/v3'] }

  # A partial of Console's own Config struct. Unlike genpartial it takes no
  # --header, and its input is an external package -- hence a fingerprint on
  # the console module's version rather than on any file here.
  generate:console:config:
    internal: true
    deps:
    - task: :build:gen
    dir: charts/console
    sources:
    - ./go.mod
    - ./go.sum
    - ../../gen/partial/*.go
    generates:
    - ./zz_generated.config.go
    cmds:
    - gen partial --out zz_generated.config.go --package console --struct Config github.com/redpanda-data/console/backend/pkg/config

  generate:operator:
    desc: "Generate files for the operator Helm chart"
    cmds:
    - task: genpartial
      vars: { CHART: operator, DIR: operator/chart }
    - task: genschema
      vars: { CHART: operator, DIR: operator/chart }
    - task: gotohelm
      vars: { CHART: operator, DIR: operator/chart, BUNDLE: ['github.com/redpanda-data/redpanda-operator/pkg/chartutil']}

  generate:redpanda:
    desc: "Generate files for the redpanda Helm chart"
    cmds:
    - task: genpartial
      vars: { CHART: redpanda }
    - task: genschema
      vars: { CHART: redpanda, OUT: ./chart/values.schema.json }
    - task: gotohelm
      vars:
        CHART: redpanda
        OUT: "./chart/templates"
        BUNDLE:
        - github.com/redpanda-data/redpanda-operator/pkg/chartutil
        SUBCHARTS:
        - github.com/redpanda-data/redpanda-operator/charts/console/v3
        - github.com/redpanda-data/redpanda-operator/charts/console/v3/chart

  generate:connectors:
    desc: "Generate files for the connectors Helm chart"
    cmds:
    - task: genpartial
      vars: { CHART: connectors }
    - task: gotohelm
      vars: { CHART: connectors }

  kind-cluster:
    cmds:
      - kind create cluster --config operator/kind-for-v2.yaml

  # Below this line are internal helper tasks that configuring caching for generation tasks.

  genpartial:
    internal: true
    run: when_changed
    label: "genpartial:{{ .CHART }}"
    desc: "Generate a 'partial' version of the Values struct"
    deps:
    - task: :build:gen
    vars:
      CHART: '{{ .CHART }}'
      DIR: '{{ .DIR | default (printf "charts/%s" .CHART ) }}'
      STRUCT: '{{ .STRUCT | default "Values" }}'
    dir: "{{ .DIR }}"
    requires:
      vars: [CHART]
    sources:
    - ./*.go
    - ./**/*.go
    - '{{ .SRC_DIR }}/licenses/boilerplate.go.txt'
    - exclude: ./{{ .STRUCT | lower }}_partial.gen.go
    - exclude: ./**/zz_*.go
    generates:
    - ./{{ .STRUCT | lower }}_partial.gen.go
    cmds:
    - gen partial --header {{ .SRC_DIR }}/licenses/boilerplate.go.txt --out ./{{ .STRUCT | lower }}_partial.gen.go --struct {{ .STRUCT }} .

  genschema:
    internal: true
    run: when_changed
    label: "genschema:{{ .CHART }}"
    desc: "Generate the values JSON schema from the Values struct"
    deps:
    - task: :build:gen
    vars:
      CHART: '{{ .CHART }}'
      DIR: '{{ .DIR | default (printf "charts/%s" .CHART ) }}'
      OUT: '{{ .OUT | default "./values.schema.json" }}'
    dir: '{{ .DIR }}'
    requires:
      vars: [CHART]
    sources:
    - ./*.go
    generates:
    - "{{ .OUT }}"
    cmds:
    - gen schema {{ .CHART }} > {{ .OUT }}

  gotohelm:
    internal: true
    run: when_changed
    label: "gotohelm:{{ .CHART }}"
    desc: "Generate helm templates from Go definitions"
    deps:
    - task: :build:gotohelm
    vars:
      CHART: '{{ .CHART }}'
      SUBCHARTS: '{{ .SUBCHARTS | default (list) | join " " }}'
      BUNDLE: '{{ range $bundled := .BUNDLE }} --bundle {{ $bundled }} {{ end }}'
      DIR: '{{ .DIR | default (printf "charts/%s" .CHART ) }}'
      OUT: '{{ .OUT | default "./templates" }}'
    requires:
      vars: [CHART]
    dir: "{{ .DIR }}"
    sources:
    - ./*.go
    - ./**/*.go
    generates:
    - "{{ .OUT }}/*"
    - "{{ .OUT }}/**/*"
    cmds:
    # Generate helm templates from Go definitions
    - gotohelm --write {{ .OUT }} . {{ .SUBCHARTS }} {{ .BUNDLE }}

  download-dependencies:
    desc: "Build out the charts/ directory from the Chart.lock file"
    vars:
      CHART: '{{ .CHART }}'
      DIR: '{{ .DIR | default (printf "charts/%s" .CHART ) }}'
    requires:
      vars: [CHART]
    dir: "{{ .DIR }}"
    sources:
    - ./charts/*
    generates:
    - ./charts/*
    cmds:
    - helm repo add redpanda https://charts.redpanda.com
    - helm dep build .
